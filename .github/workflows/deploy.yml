name: Build and Release Executable

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      # Windows gebruikt ; als separator, Linux/macOS gebruiken :
      - name: Build Executable (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --noconsole --onefile --add-data "frontend/dist;frontend/dist" main.py

      - name: Build Executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: pyinstaller --noconsole --onefile --add-data "frontend/dist:frontend/dist" main.py

      - name: Zip Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/main.exe -DestinationPath dist/ImageExtractor-Windows.zip

      - name: Zip Linux/macOS
        if: runner.os != 'Windows'
        run: zip -j dist/ImageExtractor-${{ runner.os }}.zip dist/main

      - name: Upload Zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ImageExtractor-${{ runner.os }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
